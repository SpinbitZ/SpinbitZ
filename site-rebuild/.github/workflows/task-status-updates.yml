name: Task Status Updates

on:
  issues:
    types: [labeled, unlabeled, edited, closed, reopened]
  project_card:
    types: [created, edited, moved, converted, deleted]

jobs:
  process-status-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Process status update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            npm run process-issue-status
          elif [ "${{ github.event_name }}" = "project_card" ]; then
            npm run process-project-card
          fi 